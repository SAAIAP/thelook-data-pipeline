version: 2

models:
  - name: stg_orders
    description: "Cleaned orders from raw source"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['complete','cancelled','returned','processing','shipped']
  - name: stg_order_items
    description: "Cleaned order line items"
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: sale_price
        tests: [not_null]
  - name: stg_products
    description: "Cleaned product catalogue"
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: retail_price
        tests: [not_null]
      - name: cost
        tests: [not_null]
  - name: stg_users
    description: "Cleaned user records"
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
      - name: gender
        tests:
          - accepted_values:
              values: ['male', 'female']
